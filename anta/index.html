<script id="app-js">
(async function () {
  "use strict";
  const SENDER_URL = "https://claude.ai/artifact/KNPkVGp6xKN3qu3GtH6ZNF";
  const LEAD_MS = 150000;  // countdown before the drum starts: GitHub needs ~1 minute to publish the new round to every phone

  // ================= board geometry (world units, 360 × 752) =================
  // drum (stage 1: mix) → pegs → funnel (one ball out at a time) → gutter → conveyor → cups
  const W = 360, H = 752, PR = 3.5, TAU = Math.PI * 2, G = 980;
  const DCX = W / 2, DCY = 92, DR = 74, PADDLE = 24, NPADDLE = 4;   // mixing drum with paddles

  const BELT_Y = 646, BELT_V = 150, GY1 = 610;                      // conveyor top, belt speed px/s, gutter end height
  const CUP_TOP = 672, CUP_BOT = 720;

  const holeX = k => (k + 0.5) * (W / NCUPS);

  function setupBoard(n) {

  // a spinning drum with paddles that mixes the balls before it opens. start[b] = drum spot of ball b.
  // Returns finish order (ball ids), exit times (ms from the start of the spin) and positions recorded at
  // 30 fps as [x×2, y×2, angle×10] so every screen replays the identical race.
  function simulate(start, seed) {

    rec();
    function resolve(b, nx, ny, svx, svy, e0, mu) {   // n points from the surface into the ball; s = surface velocity

      if (vn < 0) { const e = -vn < 35 ? 0 : e0; jn = -(1 + e) * vn; vx[b] += jn * nx; vy[b] += jn * ny; }

        x[b] += vx[b] * DT; y[b] += vy[b] * DT; an[b] += w[b] * DT;
      }
      for (let it = 0; it < 2; it++) {
        for (let ii = 0; ii < B; ii++) { const i = ord[ii]; if (!live[i]) continue; for (let jj = ii + 1; jj < B; jj++) { const j = ord[jj]; if (!live[j]) continue;
          const dx = x[j] - x[i], dy = y[j] - y[i], d2 = dx * dx + dy * dy;
          if (d2 >= 4 * R * R || d2 === 0) continue;

          x[i] -= nx * ov; y[i] -= ny * ov; x[j] += nx * ov; y[j] += ny * ov;
          const rel = (vx[j] - vx[i]) * nx + (vy[j] - vy[i]) * ny;
          if (rel < 0) {
            const e = -rel < 35 ? 0 : 0.45, im = -(1 + e) * rel / 2;
            vx[i] -= im * nx; vy[i] -= im * ny; vx[j] += im * nx; vy[j] += im * ny;
            const tx = -ny, ty = nx, slip = (vx[j] - vx[i]) * tx + (vy[j] - vy[i]) * ty + (w[i] + w[j]) * R;   // surfaces rubbing
            let J = slip / 7; const cap = 0.1 * im; if (J > cap) J = cap; else if (J < -cap) J = -cap;
            vx[i] += J * tx; vy[i] += J * ty; vx[j] -= J * tx; vy[j] -= J * ty; w[i] -= 2.5 * J / R; w[j] -= 2.5 * J / R;

            for (let k = 0; k < NPADDLE; k++) {

    }
    rec();
    return { order, exitT, frames };
  }

  // ================= state =================
  // Rounds live in round.json next to this page. Everyone polls it; the organiser writes it through the GitHub API.
  let clockOffset = 0; const offs = [];
  function nowS() { return Date.now() + clockOffset; }   // server-synced clock so every phone opens the gate together
  async function fetchState() {
    const t0 = Date.now(), res = await fetch("round.json?t=" + t0, { cache: "no-store" }), t1 = Date.now();

  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    ctx.fillStyle = "rgba(255,255,255,0.95)"; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(lx, ly, w, 17, 8); else ctx.rect(lx, ly, w, 17); ctx.fill();
    ctx.fillStyle = "#10151a"; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(text, lx + 6, ly + 9);
  }
  function draw(now) {
    fit(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(staticLayer, 0, 0); ctx.setTransform(scale, 0, 0, scale, 0, 0);
    let e = current && race ? now - current.revealAt : -1;
    if (current && race && reduced && e > 0 && e < END_MS) e = END_MS;
    drawBelt(e, e > MIX_MS && e < END_MS);
    const de = race ? e : -1;
    drawDrum(de, false);
    const list = []; for (let b = 0; b < B; b++) if (b !== mine) list.push(b); if (mine >= 0) list.push(mine);
    let minePos = null;
    for (const b of list) { const p = ballAt(b, e); drawBall(p, b, b === mine); if (b === mine) minePos = p; }
    drawDrum(de, true);
    if (minePos) label(minePos, first(ROSTER[mine]) + (current && race && rankOf[mine] >= 0 && e >= sched[rankOf[mine]].inCup ? " · ลำดับ " + (rankOf[mine] + 1) : ""));
    if (current && race && e < 0) {
      const s = Math.ceil(-e / 1000);
      ctx.fillStyle = "rgba(8,14,26,0.72)"; ctx.beginPath(); ctx.arc(W / 2, 300, 52, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.font = "700 46px " + fonts.mono; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(String(s), W / 2, 302);
    }
    return e;
  }

  // ================= timeline (clock-driven: every screen shows the same moment) =================
  let filled = 0, running = false;
  function fillTo(k, fresh) {
    while (filled < k) { const li = slotEls[filled]; li.classList.add("filled"); if (fresh) li.classList.add("fresh"); li.querySelector(".name").textContent = current.order[filled]; filled++; }
  }
  function resetSlots() { filled = 0; slotEls.forEach(li => { li.classList.remove("filled", "fresh"); li.querySelector(".name").textContent = "รอจับ"; }); }
  const tag = () => testing ? "ทดลอง" : "รอบที่ " + current.n;
  function setSay(pos, name, text) { say.textContent = ""; if (pos) say.append(el("span", "pos", String(pos)), name); else say.textContent = text; }
  function phase(now) {
    if (!current || !race) return current ? "done" : "idle";
    const e = now - current.revealAt; return e < 0 ? "countdown" : e < END_MS ? "running" : "done";
  }
  function tick() {
    const now = nowS(), p = phase(now), e = draw(now);
    if (p === "idle") { running = false; setSay(0, "", "รอผู้จัดคิวกดปล่อยลูกบอล"); hint.textContent = "เปิดหน้านี้ค้างไว้ได้เลย เมื่อผู้จัดคิวกด หน้านี้จะขึ้นนับถอยหลังเองภายในราว 1 นาที ไม่ต้องรีเฟรช"; return; }
    if (p === "countdown") {
      running = true; setSay(0, "", tag() + " · ปล่อยลูกใน " + Math.ceil(-e / 1000) + " วินาที");
      hint.textContent = testing ? "โหมดทดลอง: เห็นแค่เครื่องนี้ ไม่บันทึก ไม่นับเป็นรอบ" : "นับถึง 0 วงล้อจะหมุนคละลูก แล้วเปิดปล่อยทุกลูกลงพร้อมกัน ผลคำนวณครั้งเดียวตอนผู้จัดคิวกด (" + fmt(current.drawnAt) + ") ทุกเครื่องเห็นภาพเดียวกัน";
      return requestAnimationFrame(tick);
    }
    if (p === "running") {
      running = true;
      let out = 0; while (out < sched.length && sched[out].ex <= e) out++;
      let k = 0; while (k < sched.length && sched[k].inCup <= e) k++;
      fillTo(k, true);
      if (k > 0) setSay(k, current.order[k - 1]);
      else setSay(0, "", e < MIX_MS ? "กำลังหมุนวงล้อคละลูก…" : out ? "ลูกแรกหลุดแล้ว กำลังไหลไปที่สายพาน…" : "เปิดวงล้อแล้ว! ลูกบอลกำลังลง…");
      hint.textContent = (e < MIX_MS ? "ด่าน 1: คละลูกในวงล้อ" : "หลุดจากกรวยแล้ว " + out + " ลูก · ลงหลุมแล้ว " + k + " จาก " + current.order.length) + " · " + (testing ? "โหมดทดลอง ไม่บันทึก" : "รอบที่ " + current.n);
      return requestAnimationFrame(tick);
    }
    running = false; const late = filled === 0; fillTo(slotEls.length, !late);
    if (!testing && isStale(current)) { setSay(0, "", "รอจับรอบใหม่ด้วยรายชื่อใหม่"); hint.textContent = "รายชื่อคนขับเปลี่ยนหลังรอบที่ " + current.n + " ลำดับด้านล่างยังเป็นของรอบที่ " + current.n + " จนกว่าผู้จัดคิวจะจับรอบใหม่"; }
    else if (testing) { setSay(0, "", "ทดลองเสร็จ · ลำดับ 1: " + current.order[0]); hint.textContent = "ผลทดลองไม่ถูกบันทึกและไม่มีใครเห็น กด \"กลับไปดูผลจริง\" เพื่อกลับ"; }
    else { setSay(0, "", "ลำดับรอบที่ " + current.n + " · ลำดับ 1: " + current.order[0]); hint.textContent = "จับเมื่อ " + fmt(current.drawnAt) + " · ลำดับนี้ใช้รันงานจนกว่าจะเริ่มรอบใหม่"; }
    refreshOwner();
  }
  readFonts();
  window.addEventListener("resize", () => { staticLayer = null; if (!running) draw(nowS()); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readFonts(); staticLayer = null; if (!running) tick(); });

  // ================= organiser (open this page with #organiser) =================
  const REPO = "tanawat35/bullrock-group", PATH = "anta/round.json", BRANCH = "main", TOKEN_KEY = "anta-gh-token";
  let armedUntil = 0, busy = false, pendingN = 0;
  function status(cls, text) { ownerStatus.className = "status" + (cls ? " " + cls : ""); ownerStatus.textContent = text; }
  function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
  function showTokenState() { tokenState.textContent = getToken() ? "เครื่องนี้มี token แล้ว กดปล่อยจริงได้" : "ยังไม่มี token บนเครื่องนี้ ใส่ token ที่สร้างจาก GitHub (สิทธิ์เขียนเฉพาะ repo bullrock-group) เพื่อให้ปุ่มปล่อยจริงบันทึกผลได้"; }
  let draft = ROSTER.slice(), pendingRoster = false;
  const normName = v => v.replace(/\s+/g, " ").trim();
  const rosterDirty = () => JSON.stringify(draft) !== JSON.stringify(ROSTER);
  function renderRoster(msg, cls) {
    rosterH.textContent = "รายชื่อคนขับ (" + draft.length + " คน)";
    rosterList.textContent = "";
    draft.forEach((n, i) => {
      const li = el("li", ROSTER.includes(n) ? "" : "added"); li.append(n);
      const x = el("button", null, "×"); x.type = "button"; x.setAttribute("aria-label", "ลบ " + n);
      x.addEventListener("click", () => { draft.splice(i, 1); renderRoster(); refreshOwner(); });
      li.append(x); rosterList.append(li);
    });
    saveRosterBtn.disabled = busy || pendingRoster || !rosterDirty() || !getToken() || draft.length < 2 || draft.length > MAX_NAMES;
    resetRosterBtn.disabled = !rosterDirty() || pendingRoster;
    if (msg != null) { rosterStatus.className = "status" + (cls ? " " + cls : ""); rosterStatus.textContent = msg; return; }
    if (pendingRoster) return;
    const added = draft.filter(n => !ROSTER.includes(n)), removed = ROSTER.filter(n => !draft.includes(n));
    rosterStatus.className = "status" + (rosterDirty() ? " warn" : "");
    rosterStatus.textContent = !rosterDirty() ? "" : "ยังไม่ได้บันทึก" + (added.length ? " · เพิ่ม: " + added.join(", ") : "") + (removed.length ? " · ลบ: " + removed.join(", ") : "") + (draft.length < 2 ? " · ต้องมีอย่างน้อย 2 คน" : "");
  }
  function addName() {
    const v = normName(newName.value); if (!v) return;
    if (draft.includes(v)) { renderRoster("มีชื่อ \"" + v + "\" อยู่แล้ว", "warn"); return; }
    if (draft.length >= MAX_NAMES) { renderRoster("ใส่ได้สูงสุด " + MAX_NAMES + " คน ถ้ามากกว่านี้ลูกบอลจะเล็กจนมองไม่เห็นบนมือถือ", "warn"); return; }
    draft.push(v); newName.value = ""; renderRoster(); refreshOwner(); newName.focus();
  }
  function refreshOwner() {
    if (owner.hidden) return;
    renderRoster();
    const p = phase(nowS()), nextN = (REAL ? REAL.n : 0) + 1, moving = p === "countdown" || p === "running";
    copyBtn.disabled = !REAL || testing || p !== "done"; drawBtn.className = "act";
    testBtn.disabled = busy || moving; backBtn.hidden = !testing; backBtn.disabled = moving;
    if (busy) { drawBtn.disabled = true; return; }
    if (!getToken()) { drawBtn.disabled = true; drawBtn.textContent = "ใส่ token ด้านล่างก่อนกดปล่อยจริง"; return; }
    if (moving) { drawBtn.disabled = true; drawBtn.textContent = testing ? "กำลังทดลอง…" : "กำลังปล่อย…"; setTimeout(refreshOwner, 1000); return; }
    drawBtn.disabled = false;
    if (!REAL) drawBtn.textContent = "ปล่อยลูกบอล — จับรอบที่ 1";
    else if (nowS() < armedUntil) { drawBtn.className = "act confirm"; drawBtn.textContent = "ยืนยัน จับรอบที่ " + nextN; }
    else drawBtn.textContent = "เริ่มรอบใหม่ (รอบที่ " + nextN + ")";
  }
  function randInt(n) { const max = Math.floor(0x100000000 / n) * n, b = new Uint32Array(1); do { crypto.getRandomValues(b); } while (b[0] >= max); return b[0] % n; }
  function shuffle(arr) { const x = arr.slice(); for (let i = x.length - 1; i > 0; i--) { const j = randInt(i + 1); [x[i], x[j]] = [x[j], x[i]]; } return x; }
  function makeRound(now, lead) {
    const slotsShuffled = shuffle([...Array(B).keys()]);       // ball b starts on drum spot slotsShuffled[b]
    const seed = randInt(0x7fffffff);
    const sim = simulate(slotsShuffled, seed);
    return { n: (REAL ? REAL.n : 0) + 1, drawnAt: new Date(now).toISOString(), revealAt: now + (lead == null ? LEAD_MS : lead),
      order: sim.order.map(b => ROSTER[b]), race: { v: 2, start: slotsShuffled, seed, exitT: sim.exitT, frames: sim.frames } };
  }
  const b64e = s => { const u = new TextEncoder().encode(s); let bin = ""; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); };
  const b64d = s => { const bin = atob(s.replace(/\s/g, "")), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); };
  function ghError(code) {
    if (code === 401) return "token ไม่ถูกต้องหรือหมดอายุ สร้างใหม่แล้วใส่อีกครั้ง";
    if (code === 403 || code === 404) return "token นี้ไม่มีสิทธิ์เขียน repo bullrock-group (ตอนสร้างต้องเลือก repo นี้ และให้สิทธิ์ Contents: Read and write)";
    if (code === 409 || code === 422) return "มีการบันทึกพร้อมกันจากที่อื่น รอสักครู่แล้วกดใหม่";
    return "GitHub ตอบกลับผิดปกติ (" + code + ") ยังไม่มีใครเห็นผลรอบนี้ ลองใหม่อีกครั้ง";
  }
  async function onDraw() {
    if (busy || !getToken()) return;
    if (rosterDirty()) { status("warn", "มีการแก้รายชื่อที่ยังไม่ได้บันทึก กด \"บันทึกรายชื่อขึ้นเว็บ\" หรือ \"ยกเลิกการแก้\" ก่อนจับ"); return; }
    if (pendingRoster) { status("warn", "รอเว็บอัปเดตรายชื่อใหม่ก่อน (ประมาณ 1 นาที) หน้านี้จะโหลดใหม่เอง"); return; }
    if (REAL && nowS() >= armedUntil) {
      armedUntil = nowS() + 6000; status("warn", "กดปุ่มสีส้มอีกครั้งภายใน 6 วินาทีเพื่อยืนยัน รอบเดิมจะยังอยู่ในประวัติให้ทุกคนเห็น");
      refreshOwner(); setTimeout(refreshOwner, 6100); return;
    }
    busy = true; refreshOwner(); status("", "กำลังอ่านข้อมูลล่าสุดจาก GitHub…");
    const url = "https://api.github.com/repos/" + REPO + "/contents/" + PATH, headers = { Authorization: "Bearer " + getToken(), Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
    let latest, sha;
    try {
      const r = await fetch(url + "?ref=" + BRANCH + "&t=" + Date.now(), { headers, cache: "no-store" });
      if (!r.ok) { busy = false; status("bad", ghError(r.status)); refreshOwner(); return; }
      const j = await r.json(); sha = j.sha; latest = JSON.parse(b64d(j.content));
    } catch (e) { busy = false; status("bad", "ติดต่อ GitHub ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่"); refreshOwner(); return; }
    if (JSON.stringify(latest.roster) !== JSON.stringify(ROSTER)) { busy = false; status("warn", "รายชื่อบน GitHub ไม่ตรงกับหน้านี้ กำลังโหลดรายชื่อล่าสุด…"); applyState(latest); return; }
    const lastN = latest.rounds.length ? latest.rounds[latest.rounds.length - 1].n : 0;
    if (lastN !== (REAL ? REAL.n : 0)) { busy = false; applyState(latest); status("warn", "บน GitHub มีรอบที่ " + lastN + " ที่หน้านี้ยังไม่เห็น โหลดให้แล้ว ตรวจดูก่อนกดอีกครั้ง"); return; }
    status("", "กำลังสุ่มและบันทึก…");
    const round = makeRound(nowS(), LEAD_MS);
    const next = { roster: latest.roster, rounds: latest.rounds.map(r => ({ n: r.n, drawnAt: r.drawnAt, order: r.order })).concat([round]) };   // old replays dropped to keep the file small
    try {
      const r = await fetch(url, { method: "PUT", headers, body: JSON.stringify({ message: "ANTA: จับลำดับรอบที่ " + round.n, content: b64e(JSON.stringify(next)), sha, branch: BRANCH }) });
      busy = false;
      if (!r.ok) { status("bad", ghError(r.status)); refreshOwner(); return; }
    } catch (e) { busy = false; status("warn", "ไม่แน่ใจว่าบันทึกสำเร็จหรือไม่ รอ 1 นาทีแล้วดูว่ารอบที่ " + round.n + " ขึ้นในประวัติหรือยัง ก่อนกดใหม่"); refreshOwner(); return; }
    pendingN = round.n; applyState(next);
    status("", "บันทึกแล้ว · กำลังรอเว็บอัปเดตให้ทุกเครื่อง (ประมาณ 1 นาที) นับถอยหลังเผื่อไว้ 2 นาทีครึ่ง");
  }
  async function onSaveRoster() {
    if (busy || pendingRoster || !rosterDirty() || !getToken()) return;
    const p = phase(nowS());
    if (!testing && (p === "countdown" || p === "running")) { renderRoster("กำลังปล่อยลูกอยู่ รอให้จบก่อนแล้วค่อยบันทึกรายชื่อ", "warn"); return; }
    busy = true; refreshOwner(); renderRoster("กำลังบันทึกรายชื่อ…");
    const url = "https://api.github.com/repos/" + REPO + "/contents/" + PATH, headers = { Authorization: "Bearer " + getToken(), Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
    try {
      const r = await fetch(url + "?ref=" + BRANCH + "&t=" + Date.now(), { headers, cache: "no-store" });
      if (!r.ok) { busy = false; refreshOwner(); renderRoster(ghError(r.status), "bad"); return; }
      const j = await r.json(), latest = JSON.parse(b64d(j.content));
      if (JSON.stringify(latest.roster) !== JSON.stringify(ROSTER)) { busy = false; renderRoster("มีคนแก้รายชื่อจากที่อื่นก่อนหน้า กำลังโหลดรายชื่อล่าสุด…", "warn"); applyState(latest); return; }
      const next = { roster: draft.slice(), rounds: latest.rounds.map(x => ({ n: x.n, drawnAt: x.drawnAt, order: x.order })) };   // replays belong to the old list
      const w = await fetch(url, { method: "PUT", headers, body: JSON.stringify({ message: "ANTA: แก้รายชื่อคนขับ (" + draft.length + " คน)", content: b64e(JSON.stringify(next)), sha: j.sha, branch: BRANCH }) });
      busy = false;
      if (!w.ok) { refreshOwner(); renderRoster(ghError(w.status), "bad"); return; }
    } catch (e) { busy = false; refreshOwner(); renderRoster("ไม่แน่ใจว่าบันทึกสำเร็จหรือไม่ รอ 1 นาทีแล้วรีเฟรชดูรายชื่อ ก่อนกดใหม่", "warn"); return; }
    pendingRoster = true; refreshOwner();
    renderRoster("บันทึกแล้ว · รอเว็บอัปเดตประมาณ 1 นาที หน้านี้จะโหลดใหม่เองพร้อมลูกบอลและหลุมตามรายชื่อใหม่", "ok");
  }
  async function onCopy() {
    if (!REAL) return;
    const text = "ANTA รอบที่ " + REAL.n + " · จับเมื่อ " + fmt(REAL.drawnAt) + "\n" + REAL.order.map((n, i) => (i + 1) + ". " + n).join("\n");
    try { await navigator.clipboard.writeText(text); status("ok", "คัดลอกแล้ว เปิดหน้า \"ส่งผลเข้า Sheet\" แล้ววาง"); }
    catch (e) { copyArea.value = text; copyArea.hidden = false; copyArea.focus(); copyArea.select(); status("", "เลือกข้อความไว้แล้ว กดคัดลอกเอง"); }
  }
  function play(round, isTest, scroll) {   // switch what this screen shows; nothing is saved
    testing = isTest; current = round; race = isTest ? round.race : replayOf(round);
    setRanks(); buildSched(); buildSlots(round ? round.order.length : B); resetSlots(); armedUntil = 0;
    if (scroll) stage.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
    refreshOwner(); tick();
  }
  function applyState(st) {
    if (JSON.stringify(st.roster) !== JSON.stringify(ROSTER)) { location.reload(); return; }   // driver list changed
    STATE = st; REAL = st.rounds.length ? st.rounds[st.rounds.length - 1] : null;
    renderHistory();
    if (!testing && !running) play(REAL, false, false);
    else if (!testing) { current = REAL; race = replayOf(REAL); setRanks(); buildSched(); }
    refreshOwner();
  }
  async function poll() {
    try {
      const st = await fetchState();
      const a = st.rounds.length ? st.rounds[st.rounds.length - 1] : null;
      if ((a && a.drawnAt) !== (REAL && REAL.drawnAt) || st.rounds.length !== STATE.rounds.length) applyState(st);
      if (pendingN && a && a.n === pendingN) { pendingN = 0; status("ok", "เว็บอัปเดตแล้ว คนขับทุกเครื่องเห็นนับถอยหลังแล้ว"); }
    } catch (e) { /* try again next round */ }
  }
  setInterval(poll, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
  testBtn.addEventListener("click", () => { status("", "โหมดทดลอง: ไม่บันทึก คนอื่นไม่เห็น"); play(makeRound(nowS(), 3000), true, true); });
  backBtn.addEventListener("click", () => { status("", ""); play(REAL, false, true); });
  drawBtn.addEventListener("click", onDraw);
  addBtn.addEventListener("click", addName);
  newName.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); addName(); } });
  resetRosterBtn.addEventListener("click", () => { draft = ROSTER.slice(); renderRoster(); refreshOwner(); });
  saveRosterBtn.addEventListener("click", onSaveRoster);
  copyBtn.addEventListener("click", onCopy);
  saveTokenBtn.addEventListener("click", () => { const v = tokenInput.value.trim(); if (!v) return; try { localStorage.setItem(TOKEN_KEY, v); } catch (e) {} tokenInput.value = ""; showTokenState(); refreshOwner(); });
  clearTokenBtn.addEventListener("click", () => { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} showTokenState(); refreshOwner(); });
  window.__antaSimulate = simulate;   // used only by tests
  window.__antaSetup = setupBoard;     // used only by tests
  window.__antaTune = o => { if (o.MIX_MS) MIX_MS = o.MIX_MS; if (o.SPIN_W) SPIN_W = o.SPIN_W; if (o.REV_AT != null) REV_AT = o.REV_AT; };   // tests only

  function showOwner() { owner.hidden = location.hash !== "#organiser"; showTokenState(); refreshOwner(); }
  window.addEventListener("hashchange", showOwner);
  showOwner();
  tick();
})();
</script>
