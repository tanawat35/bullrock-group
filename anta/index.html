<script id="state" type="application/json">{"roster":["มีนา เรืองศิริ","ธนวัฒน์ หอมชื่น","ภาณุวัฒน์ ครึ้มค้างพลู","สัญชัย ศรีอินทร์จันทร์","ธนูเดช เชื้อวงษ์","พีระยุทธ์ คำดี","เลอสรรค์ โคขุนทด","สมบูรณ์ เครือยิหวา","อัครินทร์ กุลศิริธนวัฒน์","ชาญวิทย์ ภู่พงษ์สิน","ศุภสิทธิ์ จันทร์สิน","วัลลภ บุตรดี","บุญมาก ปริธรรมมา","อาสือมั่น ตาเฮ","วันเฉลิม มงคลบุตร","แสงทอง ด่านระหาร","ปุณณวิช แสงใส"],"rounds":[]}</script>
<script id="app-js">
(async function () {
  "use strict";
  const SENDER_URL = "https://claude.ai/artifact/KNPkVGp6xKN3qu3GtH6ZNF";
  const LEAD_MS = 150000;  // countdown before the gate opens: GitHub needs ~1 minute to publish the new round to every phone

  // ================= board geometry (world units, 360 × 672) =================
  const W = 360, H = 672, R = 8.5, PR = 3.5, TAU = Math.PI * 2;
  const FY0 = 352, FY1 = 480, EX = 11.5, FIN = 505;             // funnel top/bottom, half exit width (one ball at a time), finish line
  const BELT_Y = 566, X0 = 11.5, BELT_V = 150;                  // conveyor top, ball start x on belt, belt speed px/s
  const GX0 = W / 2, GY0 = FIN + 6, GX1 = X0 + 4, GY1 = 530;      // single-file gutter from the exit, ending above the belt's left end (ball-centre path)
  const CUP_TOP = 592, CUP_BOT = 640, CUP_REST = CUP_BOT - R - 2;
  const G = 980;
  const PEGS = [];
  for (let row = 0; row < 10; row++) { const y = 60 + row * 30; const off = row % 2 ? 18 : 0; for (let x = 18 + off; x <= 342; x += 36) if (x > 2 * R + PR + 8 && x < W - (2 * R + PR + 8)) PEGS.push([x, y]); }   // no peg so close to a wall that a ball could wedge
  const SEGS = [[0, 0, 0, FY0], [W, 0, W, FY0], [0, FY0, W / 2 - EX, FY1], [W, FY0, W / 2 + EX, FY1], [W / 2 - EX, FY1, W / 2 - EX, FIN - 2], [W / 2 + EX, FY1, W / 2 + EX, FIN - 2]];
  const LEDGES = [];   // angled wall bumpers so no ball can free-fall down a wall
  for (let row = 0; row < 10; row += 2) { const y = 60 + row * 30; LEDGES.push([0, y - 12, 15, y + 1], [W, y - 12, W - 15, y + 1]); }
  LEDGES.forEach(l => SEGS.push(l));
  const startX = (s, B) => 22 + s * (316 / Math.max(B - 1, 1));
  const START_Y = 18;
  const holeX = k => (k + 0.5) * (W / 17);

  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // Physics race: gravity, spin and rolling friction (solid spheres), speed-dependent bounce, ball-to-ball hits.
  // start[b] = start slot of ball b. Returns finish order (ball ids), exit times (ms) and positions recorded
  // at 30 fps as [x×2, y×2, angle×10] so every screen replays the identical race.
  function simulate(start, seed) {
    const B = start.length, rnd = mulberry32(seed), DT = 1 / 480, REC = 16, WMAX = 70;
    const x = [], y = [], vx = [], vy = [], w = [], an = [], live = [];
    for (let b = 0; b < B; b++) { x[b] = startX(start[b], B) + (rnd() - 0.5) * 3; y[b] = START_Y; vx[b] = (rnd() - 0.5) * 16; vy[b] = 0; w[b] = 0; an[b] = rnd() * TAU; live[b] = true; }
    const frames = [], exitT = new Array(B).fill(-1), order = [];
    const rec = () => { for (let b = 0; b < B; b++) frames.push(Math.round(x[b] * 2), Math.round(y[b] * 2), Math.round(an[b] * 10)); };
    rec();
    function contact(b, px, py, rad, e0, mu) {
      const dx = x[b] - px, dy = y[b] - py, d2 = dx * dx + dy * dy, m = R + rad;
      if (d2 >= m * m || d2 === 0) return;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      x[b] = px + nx * m; y[b] = py + ny * m;
      const vn = vx[b] * nx + vy[b] * ny; let jn = 0;
      if (vn < 0) { const e = -vn < 35 ? 0 : e0; jn = -(1 + e) * vn; vx[b] += jn * nx; vy[b] += jn * ny; }
      const tx = -ny, ty = nx, slip = vx[b] * tx + vy[b] * ty - w[b] * R;   // contact-point slip
      let J = -slip / 3.5; const cap = mu * jn; if (J > cap) J = cap; else if (J < -cap) J = -cap;
      vx[b] += J * tx; vy[b] += J * ty; w[b] -= 2.5 * J / R;
    }
    let t = 0, step = 0, alive = B, lastExit = 2, nextKick = 0, kicks = 0;
    while (alive > 0 && t < 120) {
      for (let b = 0; b < B; b++) if (live[b]) {
        vy[b] += G * DT; vx[b] *= 0.9998; vy[b] *= 0.9998;
        w[b] *= 0.9993; if (w[b] > WMAX) w[b] = WMAX; else if (w[b] < -WMAX) w[b] = -WMAX;
        x[b] += vx[b] * DT; y[b] += vy[b] * DT; an[b] += w[b] * DT;
      }
      for (let it = 0; it < 2; it++) {
        for (let i = 0; i < B; i++) if (live[i]) for (let j = i + 1; j < B; j++) if (live[j]) {
          const dx = x[j] - x[i], dy = y[j] - y[i], d2 = dx * dx + dy * dy;
          if (d2 >= 4 * R * R || d2 === 0) continue;
          const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = (2 * R - d) / 2;
          x[i] -= nx * ov; y[i] -= ny * ov; x[j] += nx * ov; y[j] += ny * ov;
          const rel = (vx[j] - vx[i]) * nx + (vy[j] - vy[i]) * ny;
          if (rel < 0) {
            const e = -rel < 35 ? 0 : 0.45, im = -(1 + e) * rel / 2;
            vx[i] -= im * nx; vy[i] -= im * ny; vx[j] += im * nx; vy[j] += im * ny;
            const tx = -ny, ty = nx, slip = (vx[j] - vx[i]) * tx + (vy[j] - vy[i]) * ty + (w[i] + w[j]) * R;   // surfaces rubbing
            let J = slip / 7; const cap = 0.1 * im; if (J > cap) J = cap; else if (J < -cap) J = -cap;
            vx[i] += J * tx; vy[i] += J * ty; vx[j] -= J * tx; vy[j] -= J * ty; w[i] -= 2.5 * J / R; w[j] -= 2.5 * J / R;
          }
        }
        for (let b = 0; b < B; b++) if (live[b]) {
          if (y[b] < FY0) for (let p = 0; p < PEGS.length; p++) { const P = PEGS[p]; if (Math.abs(P[1] - y[b]) < 13) contact(b, P[0], P[1], PR, 0.55, 0.25); }
          for (let s = 0; s < SEGS.length; s++) {
            const S = SEGS[s], ax = S[0], ay = S[1], ex = S[2] - ax, ey = S[3] - ay;
            let u = ((x[b] - ax) * ex + (y[b] - ay) * ey) / (ex * ex + ey * ey); u = u < 0 ? 0 : u > 1 ? 1 : u;
            contact(b, ax + u * ex, ay + u * ey, 2, 0.35, 0.4);
          }
          if (y[b] < R) { y[b] = R; vy[b] = Math.abs(vy[b]) * 0.3; }
        }
      }
      t += DT; step++;
      for (let b = 0; b < B; b++) if (live[b] && y[b] > FIN) { live[b] = false; alive--; exitT[b] = Math.round(t * 1000); order.push(b); lastExit = t; }
      if (t - lastExit > 3 && t >= nextKick) {   // shake the board only if a ball is truly stuck
        for (let b = 0; b < B; b++) if (live[b] && vx[b] * vx[b] + vy[b] * vy[b] < 900) { vx[b] += (rnd() - 0.5) * 120; vy[b] -= rnd() * 140; kicks++; }
        nextKick = t + 0.35;
      }
      if (step % REC === 0) rec();
    }
    if (alive > 0) {   // safety net: never seen in testing; closest to the exit goes first
      const rest = []; for (let b = 0; b < B; b++) if (live[b]) rest.push(b);
      rest.sort((a, c) => y[c] - y[a]).forEach((b, i) => { exitT[b] = Math.round(t * 1000) + i * 300; order.push(b); });
    }
    rec();
    return { order, exitT, frames, kicks };
  }

  // ================= state =================
  // Rounds live in round.json next to this page. Everyone polls it; the organiser writes it through the GitHub API.
  let clockOffset = 0; const offs = [];
  function nowS() { return Date.now() + clockOffset; }   // server-synced clock so every phone opens the gate together
  async function fetchState() {
    const t0 = Date.now(), res = await fetch("round.json?t=" + t0, { cache: "no-store" }), t1 = Date.now();
    if (!res.ok) throw new Error("http " + res.status);
    const d = res.headers.get("Date");
    if (d) { offs.push(Date.parse(d) + 500 - (t0 + t1) / 2); if (offs.length > 7) offs.shift(); const s = offs.slice().sort((a, b) => a - b); clockOffset = s[Math.floor(s.length / 2)]; }
    return res.json();
  }
  let STATE;
  try { STATE = await fetchState(); }
  catch (e) { STATE = JSON.parse(document.getElementById("state").textContent); }   // snapshot if round.json can't be read
  document.getElementById("app").textContent = "";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ROSTER = STATE.roster, B = ROSTER.length;
  let REAL = STATE.rounds.length ? STATE.rounds[STATE.rounds.length - 1] : null;   // the saved round everyone sees
  let current = REAL, race = REAL && REAL.race ? REAL.race : null, testing = false;     // what this screen is playing
  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const ballColor = b => "hsl(" + Math.round(((b * 7) % 17) * 360 / 17) + " 78% 62%)";
  const rankOf = new Array(B).fill(-1);
  function setRanks() { rankOf.fill(-1); if (current) current.order.forEach((n, k) => { const b = ROSTER.indexOf(n); if (b >= 0) rankOf[b] = k; }); }
  setRanks();

  const fmt = iso => new Date(iso).toLocaleString("th-TH", { timeZone: "Asia/Bangkok", dateStyle: "medium", timeStyle: "short" });
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const first = n => n.split(" ")[0];

  // ================= markup =================
  const app = document.getElementById("app");
  const wrap = el("div", "wrap"); app.append(wrap);
  const header = el("header");
  header.append(el("span", "eyebrow", "BULLROCK EXPRESS · ANTA · รถ 4W"), el("h1", null, "ปล่อยลูกบอลจับลำดับคิว"),
    el("p", "sub", "ลูกบอล 17 ลูก ลูกละคน เริ่มจากช่องที่สุ่มให้ ปล่อยพร้อมกัน เด้งผ่านหมุดลงกรวย ลูกไหนหลุดออกจากกรวยก่อนได้ลำดับก่อน แล้วสายพานพาไปลงหลุมตามลำดับ 1 ถึง 17"));
  wrap.append(header);

  const stage = el("section", "panel stage"); stage.setAttribute("aria-live", "polite");
  const boardBox = el("div", "boardBox"); const canvas = el("canvas"); canvas.setAttribute("aria-hidden", "true"); boardBox.append(canvas);
  const say = el("p", "say"); const hint = el("p", "hint");
  const legendTitle = el("p", "hint", "แตะชื่อตัวเองเพื่อไฮไลต์ลูกบอลของคุณ");
  const legend = el("div", "legend");
  stage.append(say, boardBox, hint, legendTitle, legend); wrap.append(stage);

  let mine = -1;
  try { const v = localStorage.getItem("anta-mine"); if (v != null && ROSTER[+v]) mine = +v; } catch (e) {}
  const chips = ROSTER.map((n, b) => {
    const c = el("button", "chip"); c.type = "button"; c.setAttribute("aria-pressed", String(b === mine));
    const dot = el("span", "dot", LETTERS[b]); dot.style.background = ballColor(b); c.append(dot, first(n));
    c.addEventListener("click", () => {
      mine = mine === b ? -1 : b; chips.forEach((x, i) => x.setAttribute("aria-pressed", String(i === mine)));
      try { localStorage.setItem("anta-mine", String(mine)); } catch (e) {}
      if (!running) draw(nowS());
    });
    legend.append(c); return c;
  });

  const slots = el("ol", "slots"); const slotEls = [];
  for (let i = 0; i < B; i++) { const li = el("li", "slot"); li.append(el("span", "num", String(i + 1)), el("span", "name", "รอจับ")); slots.append(li); slotEls.push(li); }
  wrap.append(slots);

  const histBox = el("section", "panel"); histBox.append(el("h2", null, "ประวัติการจับ"));
  const hist = el("ul", "hist");
  histBox.append(el("p", "hint", "ทุกครั้งที่กดจับจะถูกเก็บไว้ตรงนี้ ถ้ามีการจับใหม่ ทุกคนจะเห็นรอบเก่าด้วย"), hist); wrap.append(histBox);

  const owner = el("section", "panel"); owner.hidden = true;
  owner.append(el("h2", null, "สำหรับผู้จัดคิว"));
  const ownerBtns = el("div", "btns");
  const drawBtn = el("button", "act", ""); drawBtn.type = "button"; drawBtn.id = "drawBtn";
  const copyBtn = el("button", "act ghost", "คัดลอกผลไปส่งเข้า Sheet"); copyBtn.type = "button"; copyBtn.id = "copyBtn";
  const testBtn = el("button", "act ghost", "ทดลองปล่อย (เห็นแค่เครื่องนี้ ไม่บันทึก)"); testBtn.type = "button"; testBtn.id = "testBtn";
  const backBtn = el("button", "act ghost", "กลับไปดูผลจริง"); backBtn.type = "button"; backBtn.id = "backBtn"; backBtn.hidden = true;
  ownerBtns.append(drawBtn, testBtn, backBtn, copyBtn);

  function shuffle(arr) { const x = arr.slice(); for (let i = x.length - 1; i > 0; i--) { const j = randInt(i + 1); [x[i], x[j]] = [x[j], x[i]]; } return x; }
  function makeRound(now, lead) {
    const slotsShuffled = shuffle([...Array(B).keys()]);       // ball b starts in slot slotsShuffled[b]
    const seed = randInt(0x7fffffff);
    const sim = simulate(slotsShuffled, seed);
    return { n: (REAL ? REAL.n : 0) + 1, drawnAt: new Date(now).toISOString(), revealAt: now + (lead == null ? LEAD_MS : lead),
      order: sim.order.map(b => ROSTER[b]), race: { start: slotsShuffled, seed, exitT: sim.exitT, frames: sim.frames } };
  }
  const b64e = s => { const u = new TextEncoder().encode(s); let bin = ""; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); };
  const b64d = s => { const bin = atob(s.replace(/\s/g, "")), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); };
  function ghError(code) {
    if (code === 401) return "token ไม่ถูกต้องหรือหมดอายุ สร้างใหม่แล้วใส่อีกครั้ง";
    if (code === 403 || code === 404) return "token นี้ไม่มีสิทธิ์เขียน repo bullrock-group (ตอนสร้างต้องเลือก repo นี้ และให้สิทธิ์ Contents: Read and write)";
    if (code === 409 || code === 422) return "มีการบันทึกพร้อมกันจากที่อื่น รอสักครู่แล้วกดใหม่";
    return "GitHub ตอบกลับผิดปกติ (" + code + ") ยังไม่มีใครเห็นผลรอบนี้ ลองใหม่อีกครั้ง";
  }
  async function onDraw() {
    if (busy || !getToken()) return;
    if (REAL && nowS() >= armedUntil) {
      armedUntil = nowS() + 6000; status("warn", "กดปุ่มสีส้มอีกครั้งภายใน 6 วินาทีเพื่อยืนยัน รอบเดิมจะยังอยู่ในประวัติให้ทุกคนเห็น");
      refreshOwner(); setTimeout(refreshOwner, 6100); return;
    }
    busy = true; refreshOwner(); status("", "กำลังอ่านข้อมูลล่าสุดจาก GitHub…");
    const url = "https://api.github.com/repos/" + REPO + "/contents/" + PATH, headers = { Authorization: "Bearer " + getToken(), Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
    let latest, sha;
    try {
      const r = await fetch(url + "?ref=" + BRANCH + "&t=" + Date.now(), { headers, cache: "no-store" });
      if (!r.ok) { busy = false; status("bad", ghError(r.status)); refreshOwner(); return; }
      const j = await r.json(); sha = j.sha; latest = JSON.parse(b64d(j.content));
    } catch (e) { busy = false; status("bad", "ติดต่อ GitHub ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่"); refreshOwner(); return; }
    const lastN = latest.rounds.length ? latest.rounds[latest.rounds.length - 1].n : 0;
    if (lastN !== (REAL ? REAL.n : 0)) { busy = false; applyState(latest); status("warn", "บน GitHub มีรอบที่ " + lastN + " ที่หน้านี้ยังไม่เห็น โหลดให้แล้ว ตรวจดูก่อนกดอีกครั้ง"); return; }
    status("", "กำลังสุ่มและบันทึก…");
    const round = makeRound(nowS(), LEAD_MS);
    const next = { roster: latest.roster, rounds: latest.rounds.map(r => ({ n: r.n, drawnAt: r.drawnAt, order: r.order })).concat([round]) };   // old replays dropped to keep the file small
    try {
      const r = await fetch(url, { method: "PUT", headers, body: JSON.stringify({ message: "ANTA: จับลำดับรอบที่ " + round.n, content: b64e(JSON.stringify(next)), sha, branch: BRANCH }) });
      busy = false;
      if (!r.ok) { status("bad", ghError(r.status)); refreshOwner(); return; }
    } catch (e) { busy = false; status("warn", "ไม่แน่ใจว่าบันทึกสำเร็จหรือไม่ รอ 1 นาทีแล้วดูว่ารอบที่ " + round.n + " ขึ้นในประวัติหรือยัง ก่อนกดใหม่"); refreshOwner(); return; }
    pendingN = round.n; applyState(next);
    status("", "บันทึกแล้ว · กำลังรอเว็บอัปเดตให้ทุกเครื่อง (ประมาณ 1 นาที) นับถอยหลังเผื่อไว้ 2 นาทีครึ่ง");
  }
  async function onCopy() {
    if (!REAL) return;
    const text = "ANTA รอบที่ " + REAL.n + " · จับเมื่อ " + fmt(REAL.drawnAt) + "\n" + REAL.order.map((n, i) => (i + 1) + ". " + n).join("\n");
    try { await navigator.clipboard.writeText(text); status("ok", "คัดลอกแล้ว เปิดหน้า \"ส่งผลเข้า Sheet\" แล้ววาง"); }
    catch (e) { copyArea.value = text; copyArea.hidden = false; copyArea.focus(); copyArea.select(); status("", "เลือกข้อความไว้แล้ว กดคัดลอกเอง"); }
  }
  function play(round, isTest, scroll) {   // switch what this screen shows; nothing is saved
    testing = isTest; current = round; race = round && round.race ? round.race : null;
    setRanks(); buildSched(); resetSlots(); armedUntil = 0;
    if (scroll) stage.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
    refreshOwner(); tick();
  }
  function applyState(st) {
    if (JSON.stringify(st.roster) !== JSON.stringify(ROSTER)) { location.reload(); return; }   // driver list changed
    STATE = st; REAL = st.rounds.length ? st.rounds[st.rounds.length - 1] : null;
    renderHistory();
    if (!testing && !running) play(REAL, false, false);
    else if (!testing) { current = REAL; race = REAL && REAL.race ? REAL.race : null; setRanks(); buildSched(); }
    refreshOwner();
  }
  async function poll() {
    try {
      const st = await fetchState();
      const a = st.rounds.length ? st.rounds[st.rounds.length - 1] : null;
      if ((a && a.drawnAt) !== (REAL && REAL.drawnAt) || st.rounds.length !== STATE.rounds.length) applyState(st);
      if (pendingN && a && a.n === pendingN) { pendingN = 0; status("ok", "เว็บอัปเดตแล้ว คนขับทุกเครื่องเห็นนับถอยหลังแล้ว"); }
    } catch (e) { /* try again next round */ }
  }
  setInterval(poll, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
  testBtn.addEventListener("click", () => { status("", "โหมดทดลอง: ไม่บันทึก คนอื่นไม่เห็น"); play(makeRound(nowS(), 3000), true, true); });
  backBtn.addEventListener("click", () => { status("", ""); play(REAL, false, true); });
  drawBtn.addEventListener("click", onDraw);
  copyBtn.addEventListener("click", onCopy);
  saveTokenBtn.addEventListener("click", () => { const v = tokenInput.value.trim(); if (!v) return; try { localStorage.setItem(TOKEN_KEY, v); } catch (e) {} tokenInput.value = ""; showTokenState(); refreshOwner(); });
  clearTokenBtn.addEventListener("click", () => { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} showTokenState(); refreshOwner(); });
  window.__antaSimulate = simulate;   // used only by tests

  function showOwner() { owner.hidden = location.hash !== "#organiser"; showTokenState(); refreshOwner(); }
  window.addEventListener("hashchange", showOwner);
  showOwner();
  tick();
})();
</script>
